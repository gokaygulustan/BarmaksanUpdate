<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teklif kayıt belgesi — önizleme</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #5a5a5a;
      --line: #d8d4c8;
      --gold: #c9a227;
      --gold-soft: #f4ead0;
      --paper: #fffdf8;
      --head: #141414;
      --ok: #1f6b45;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Calibri, "Helvetica Neue", Arial, sans-serif;
      background: #d9d4c8;
      color: var(--ink);
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 18px;
      background: #141414;
      color: #f5f5f5;
      border-bottom: 3px solid var(--gold);
    }
    .toolbar h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .toolbar p { margin: 2px 0 0; font-size: 12px; color: #bdbdbd; }
    .toolbar button {
      border: 0;
      background: var(--gold);
      color: #1a1a1a;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .workspace {
      padding: 28px 16px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .sheet {
      width: 210mm;
      height: 297mm;
      background: var(--paper);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,.22);
      position: relative;
    }

    .sheet-head {
      flex: 0 0 auto;
      background: var(--head);
      color: #fff;
      border-top: 4px solid var(--gold);
      padding: 11px 14mm 12px;
    }
    .head-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .head-row img {
      height: 42px;
      width: auto;
      max-width: 210px;
      object-fit: contain;
    }
    .logo-on-paper { display: none; }
    .doc-mark { text-align: right; }
    .doc-mark .kicker {
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 800;
    }
    .doc-mark .title {
      margin: 2px 0 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .02em;
    }
    .doc-mark .meta {
      margin-top: 3px;
      font-size: 10px;
      color: #cfcfcf;
    }
    .head-rule {
      margin-top: 10px;
      border-top: 1px solid rgba(201,162,39,.45);
      padding-top: 7px;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #cfcfcf;
    }
    .head-rule b { color: #fff; font-weight: 700; }

    .sheet-body {
      flex: 1 1 auto;
      overflow: hidden;
      padding: 7mm 14mm 4mm;
      min-height: 0;
    }
    .sheet-foot {
      flex: 0 0 auto;
      border-top: 3px solid var(--gold);
      padding: 6px 14mm 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      font-size: 9px;
      color: var(--muted);
      background: #faf7ef;
    }
    .sheet-foot b { color: var(--ink); }

    .parties {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .box {
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 8px 10px 9px;
      background: #fff;
    }
    .box .lbl {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 3px;
    }
    .box .name { font-size: 13px; font-weight: 800; }
    .box .sub { font-size: 10.5px; color: var(--muted); line-height: 1.45; margin-top: 2px; }

    .notice {
      font-size: 10.5px;
      line-height: 1.45;
      color: var(--muted);
      border-left: 3px solid var(--gold);
      padding: 5px 0 5px 10px;
      margin: 0 0 8px;
      background: var(--gold-soft);
    }

    table.lines {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 10px;
    }
    table.lines th {
      background: #1a1a1a;
      color: #fff;
      font-size: 8px;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-weight: 800;
      padding: 5px 5px;
      border: 0;
    }
    table.lines td {
      border-bottom: 1px solid #eee6d6;
      padding: 4.5px 5px;
      vertical-align: top;
      line-height: 1.3;
    }
    table.lines tbody tr:nth-child(even) td { background: #fbf6ea; }
    .c-no { width: 7%; text-align: center; }
    .c-name { width: 31%; }
    .c-qty { width: 11%; text-align: right; }
    .c-price { width: 13%; text-align: right; }
    .c-cur { width: 8%; text-align: center; }
    .c-disc { width: 8%; text-align: right; }
    .c-vat { width: 8%; text-align: right; }
    .c-sum { width: 14%; text-align: right; font-weight: 700; }
    .muted { color: var(--muted); font-weight: 600; font-size: 9px; }
    .cont-tag {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 0 0 5px;
    }

    .closing { margin-top: 8px; }
    .grid-2 { display: grid; grid-template-columns: 1.15fr .85fr; gap: 10px; align-items: start; }
    .kv { width: 100%; border-collapse: collapse; font-size: 10.5px; }
    .kv th { text-align: left; font-weight: 600; color: var(--muted); padding: 3px 0; }
    .kv td { text-align: right; font-weight: 700; padding: 3px 0; }
    .totals {
      border: 1px solid var(--line);
      background: #fff;
      padding: 8px 10px;
    }
    .totals .grand {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 2px solid var(--gold);
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
    }
    .files { margin-top: 8px; }
    .files ul { margin: 4px 0 0; padding: 0; list-style: none; }
    .files li {
      font-size: 10.5px;
      padding: 3px 0;
      border-bottom: 1px dotted var(--line);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .legal {
      margin-top: 8px;
      font-size: 9.5px;
      color: var(--muted);
      line-height: 1.45;
    }
    .signs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 14px;
    }
    .sign {
      border-top: 1px solid var(--ink);
      padding-top: 6px;
      min-height: 48px;
    }
    .sign .who { font-size: 11px; font-weight: 800; }
    .sign .role { font-size: 9.5px; color: var(--muted); }

    .badge-ok {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ok);
      border: 1px solid #9dceb3;
      background: #e7f6ee;
      padding: 2px 7px;
      border-radius: 99px;
    }

    .sheet, .sheet *, .toolbar, .toolbar * {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      color-adjust: exact;
    }

    @media print {
      html, body, .sheet, .sheet *, .toolbar {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      body { background: #fff !important; }
      .toolbar { display: none !important; }
      .workspace { padding: 0; gap: 0; }
      .sheet {
        box-shadow: none;
        background: #fff !important;
        page-break-after: always;
        break-after: page;
      }
      .sheet:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      .sheet-head {
        background: #fff !important;
        color: #1a1a1a !important;
        border-bottom: 1px solid #d8d4c8;
      }
      .logo-on-dark { display: none !important; }
      .logo-on-paper { display: block !important; }
      .doc-mark .title { color: #1a1a1a !important; }
      .doc-mark .meta { color: #5a5a5a !important; }
      .head-rule { color: #5a5a5a !important; border-top-color: #c9a227 !important; }
      .head-rule b { color: #1a1a1a !important; }
      table.lines th {
        background: #1a1a1a !important;
        color: #fff !important;
      }
      table.lines tbody tr:nth-child(even) td { background: #fbf6ea !important; }
      .notice { background: #f4ead0 !important; }
      .box, .totals { background: #fff !important; }
      .badge-ok {
        background: #e7f6ee !important;
        color: #1f6b45 !important;
        border-color: #9dceb3 !important;
      }
      .sheet-foot { background: #faf7ef !important; }
      .cont-tag, .doc-mark .kicker, .box .lbl { color: #c9a227 !important; }
      @page { size: A4; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>
      <h1>Tedarikçi teklif kayıt belgesi — tasarım önizlemesi</h1>
      <p>Sisteme bağlı değil. Çok kalemli örnekle sayfa kırılımını kontrol edin. Yazdır / PDF ile A4 deneyin.</p>
    </div>
    <button type="button" onclick="window.print()">Yazdır / PDF</button>
  </div>
  <div class="workspace" id="workspace"></div>

      const vat = 20;
      const line = qty * price * (1 - disc / 100) * (1 + vat / 100);
      return { no: i + 1, name, qty, unit, price, currency, disc, vat, line };
    });

    const bags = { TRY: 0, USD: 0, EUR: 0 };
    items.forEach((it) => { bags[it.currency] += it.line; });
    const overall = 2;
    Object.keys(bags).forEach((c) => { bags[c] = bags[c] * (1 - overall / 100); });

    function el(html) {
      const t = document.createElement("template");
      t.innerHTML = html.trim();
      return t.content.firstElementChild;
    }

    function headerHtml(page, pages) {
      return `
        <header class="sheet-head">
          <div class="head-row">
            <img class="logo-on-dark" src="${LOGO_SCREEN}" alt="Uğur Promilling" />
            <img class="logo-on-paper" src="${LOGO_PAPER}" alt="Uğur Promilling" />
            <div class="doc-mark">
              <div class="kicker">Satın alma · teklif kaydı</div>
              <div class="title">Teklif kayıt belgesi</div>
              <div class="meta">Proforma özet · sipariş taahhüdü değildir</div>
            </div>
          </div>
          <div class="head-rule">
            <span>Belge no <b>${DOC.no}</b></span>
            <span>İletim <b>${DOC.submittedAt}</b></span>
            <span>Sayfa <b class="pg">${page}</b> / <b class="pgs">${pages}</b></span>
          </div>
        </header>`;
    }

    function footerHtml(page, pages) {
      return `
        <footer class="sheet-foot">
          <div>
            Uğur Promilling bir <b>Barmaksan Endüstri A.Ş.</b> markasıdır.
            <br />Bu çıktı tedarikçinin sisteme gönderdiği teklifin kaydıdır.
          </div>
          <div style="text-align:right">
            ${DOC.no}<br />Sayfa ${page} / ${pages}
          </div>
        </footer>`;
    }

    function makeSheet(page, pages) {
      const sheet = el(`<article class="sheet"></article>`);
      sheet.insertAdjacentHTML("beforeend", headerHtml(page, pages));
      sheet.appendChild(el(`<div class="sheet-body"></div>`));
      sheet.insertAdjacentHTML("beforeend", footerHtml(page, pages));
      return sheet;
    }

    function partiesBlock() {
      return el(`
        <div>
          <div class="parties">
            <div class="box">
              <div class="lbl">Alıcı</div>
              <div class="name">${DOC.buyer.name}</div>
              <div class="sub">${DOC.buyer.legal}<br />${DOC.buyer.addr}<br />${DOC.buyer.contact}</div>
            </div>
            <div class="box">
              <div class="lbl">Tedarikçi</div>
              <div class="name">${DOC.vendor.name} &nbsp;<span class="badge-ok">İletildi</span></div>
              <div class="sub">${DOC.vendor.legal}<br />${DOC.vendor.addr}<br />${DOC.vendor.contact}</div>
            </div>
          </div>
          <p class="notice">
            <b>${DOC.quoteRef}</b> — ${DOC.requestTitle}.
            Aşağıdaki satırlar ${DOC.vendor.name} tarafından teklif portalında onaylanarak gönderilmiştir.
          </p>
        </div>`);
    }

    function tableWrap(continued) {
      return el(`
        <div>
          ${continued ? `<p class="cont-tag">Kalem listesi · devam</p>` : ""}
          <table class="lines">
            <thead>
              <tr>
                <th class="c-no">#</th>
                <th class="c-name">Kalem</th>
                <th class="c-qty">Miktar</th>
                <th class="c-price">Birim</th>
                <th class="c-cur">Pb</th>
                <th class="c-disc">İsk.</th>
                <th class="c-vat">KDV</th>
                <th class="c-sum">Satır (KDV'li)</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>`);
    }

    function rowEl(it) {
      return el(`
        <tr>
          <td class="c-no">${it.no}</td>
          <td class="c-name">${it.name}</td>
          <td class="c-qty">${it.qty.toLocaleString("tr-TR")} <span class="muted">${it.unit}</span></td>
          <td class="c-price">${money(it.price)}</td>
          <td class="c-cur">${it.currency}</td>
          <td class="c-disc">${it.disc ? "%" + it.disc : "—"}</td>
          <td class="c-vat">%${it.vat}</td>
          <td class="c-sum">${money(it.line)} ${it.currency === "TRY" ? "₺" : it.currency === "USD" ? "$" : "€"}</td>
        </tr>`);
    }

    function closingBlock() {
      const fileLis = DOC.files.map((f) => `<li><span>${f.name}</span><span class="muted">${f.size}</span></li>`).join("");
      return el(`
        <div class="closing">
          <div class="grid-2">
            <div>
              <div class="box">
                <div class="lbl">Ticari koşullar</div>
                <table class="kv">
                  <tr><th>Nakliye</th><td>${DOC.terms.shipping}</td></tr>
                  <tr><th>Vade</th><td>${DOC.terms.maturity}</td></tr>
                  <tr><th>Döviz kuru</th><td>${DOC.terms.fx}</td></tr>
                  <tr><th>Genel iskonto</th><td>%${overall}</td></tr>
                </table>
                <div class="sub" style="margin-top:6px">${DOC.terms.note}</div>
              </div>
              <div class="box files">
                <div class="lbl">Tedarikçinin eklediği dosyalar</div>
                <ul>${fileLis}</ul>
              </div>
            </div>
            <div class="totals">
              <div class="lbl" style="margin-bottom:4px">Teklif toplamı</div>
              <table class="kv">
                <tr><th>EUR</th><td>${money(bags.EUR)} €</td></tr>
                <tr><th>USD</th><td>${money(bags.USD)} $</td></tr>
                <tr><th>TRY</th><td>${money(bags.TRY)} ₺</td></tr>
              </table>
              <div class="grand"><span>Kayıt özeti</span><span>${items.length} kalem</span></div>
            </div>
          </div>
          <p class="legal">
            Bu belge, tedarikçinin ${DOC.submittedAt} tarihinde sisteme ilettiği fiyat ve koşulların dökümüdür.
            Satın alma emri, sipariş veya ödeme taahhüdü doğurmaz. Uyuşmazlıkta portal kaydı esas alınır.
          </p>
          <div class="signs">
            <div class="sign">
              <div class="who">${DOC.vendor.name}</div>
              <div class="role">Teklifi gönderen · kaşe / imza (isteğe bağlı)</div>
            </div>
            <div class="sign">
              <div class="who">Uğur Promilling Satın Alma</div>
              <div class="role">Sistem kayıt tarihi ${DOC.submittedAt}</div>
            </div>
          </div>
        </div>`);
    }

    function fits(body, node) {
      body.appendChild(node);
      const ok = body.scrollHeight <= body.clientHeight + 1;
      if (!ok) body.removeChild(node);
      return ok;
    }

    function paginate() {
      const workspace = document.getElementById("workspace");
      workspace.innerHTML = "";
      const probe = makeSheet(1, 1);
      workspace.appendChild(probe);
      const bodyH = probe.querySelector(".sheet-body").clientHeight;
      workspace.innerHTML = "";

      const sheets = [];
      let idx = 0;
      let page = 1;

      const first = makeSheet(page, 99);
      workspace.appendChild(first);
      const firstBody = first.querySelector(".sheet-body");
      firstBody.style.height = bodyH + "px";
      firstBody.appendChild(partiesBlock());
      const t1 = tableWrap(false);
      firstBody.appendChild(t1);
      const tb1 = t1.querySelector("tbody");
      while (idx < items.length) {
        const r = rowEl(items[idx]);
        tb1.appendChild(r);
        if (firstBody.scrollHeight > firstBody.clientHeight + 1) {
          tb1.removeChild(r);
          break;
        }
        idx += 1;
      }
      sheets.push(first);
      page += 1;

      while (idx < items.length) {
        const sheet = makeSheet(page, 99);
        workspace.appendChild(sheet);
        const body = sheet.querySelector(".sheet-body");
        body.style.height = bodyH + "px";
        const tw = tableWrap(true);
        body.appendChild(tw);
        const tb = tw.querySelector("tbody");
        let added = 0;
        while (idx < items.length) {
          const r = rowEl(items[idx]);
          tb.appendChild(r);
          if (body.scrollHeight > body.clientHeight + 1) {
            tb.removeChild(r);
            break;
          }
          idx += 1;
          added += 1;
        }
        if (added === 0) {
          tb.appendChild(rowEl(items[idx]));
          idx += 1;
        }
        sheets.push(sheet);
        page += 1;
      }

      const last = sheets[sheets.length - 1];
      const lastBody = last.querySelector(".sheet-body");
      const closing = closingBlock();
      if (!fits(lastBody, closing)) {
        const extra = makeSheet(page, 99);
        workspace.appendChild(extra);
        const b = extra.querySelector(".sheet-body");
        b.style.height = bodyH + "px";
        b.appendChild(closingBlock());
        sheets.push(extra);
      }

      const total = sheets.length;
      sheets.forEach((s, i) => {
        s.querySelectorAll(".pg").forEach((n) => { n.textContent = String(i + 1); });
        s.querySelectorAll(".pgs").forEach((n) => { n.textContent = String(total); });
        const foot = s.querySelector(".sheet-foot div:last-child");
        if (foot) foot.innerHTML = `${DOC.no}<br />Sayfa ${i + 1} / ${total}`;
      });
    }

    window.addEventListener("load", paginate);
    window.addEventListener("resize", () => {
      clearTimeout(window.__p);
      window.__p = setTimeout(paginate, 200);
    });
  </script>
</body>
</html>
